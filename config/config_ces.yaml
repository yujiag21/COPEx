defaults:
  - optimizer: slsqp
  - warmstart: default 
  - experiment: ces
  - paths: ces
  - task: ces
  - embedder: embedder
  - encoder: encoder
  - head: head
  - _self_

experiment:
  trial: 13
  verbose: 1
  budget: 100.0
  n_init_evals: 1
  dim: 6
  step_size: null
  n_step: 10
  lookahead_n_fantasies: 1
  n_fantasies: 1
  n_y: 40
  discount_factor: 0.8
  fantasized_with_model: false
  cost_mode: l1_dist
  constraint_mode: None

warmstart:
  n_random: 0
  n_optimal: 1
  top_k_starts: 1

paths:
  model_path: ALINE/model/ces/inference/inference_model.pth
  design_model_path: ALINE/model/ces/design/design_model.tar
  config_name: train_prediction_design_ces
  design_config_name: train_ces
  save_path: temp
  save_folder: ces

optimizer:
  lower_bound: 0.0
  upper_bound: 100.0
  optimize_mode: budget # hard, soft, none
  soft_constraint_weight: 3 # weight for soft constraint: obj / (1 + weight * dist)

wandb:
  group: null
  project: cost-aware-BED-ces
  api_key: null  # read from the WANDB_API_KEY environment variable when set

hydra:
  run:
    dir: outputs/${now:%Y-%m-%d}/${now:%H-%M-%S}
  sweep:
    dir: outputs/multirun/${now:%Y-%m-%d}/${now:%H-%M-%S}
    subdir: ${hydra.job.num}
  job:
    chdir: false

device: "cuda"
fix_seed: true
seed: 42
time_token: false
