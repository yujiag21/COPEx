defaults:
  - optimizer: slsqp
  - warmstart: default
  - experiment: al_benchmark
  - task: al_benchmark
  - paths: al_benchmark
  - embedder: embedder
  - encoder: encoder
  - head: head
  - _self_

# EntropyDifferenceEIG (EPIG) or UncertaintySampling (predictive standard deviation)
acquisition_function: acquisition_functions.eig_acquisition.UncertaintySampling

task:
  dim_x: 2
  benchmark_name: branin # 2D: branin, ackley2d, goldstein_price, 

experiment:
  trial: 0
  verbose: 5
  budget: 2.0 
  n_init_evals: 1
  step_size: 1 
  n_step: 200 
  n_target_theta: 0
  lookahead_n_fantasies: 1 # planning horizon H (0 = myopic)
  n_fantasies: 1
  n_y: 30
  discount_factor: 0.8
  fantasized_with_model: false
  cost_mode: hazard_center # hazard_center, rough_terrain
  cost_function: run_budget_al:${experiment.cost_mode}_cost # defined in scripts/run_budget_al.py
  constraint_mode: linf
  adaptive_horizon: false 

warmstart:
  n_random: 4
  n_optimal: 1
  top_k_starts: 5
  feasible_random: true 

paths:
  model_path: ALINE/model/AL/inference/inference_model.tar
  design_model_path: ALINE/model/AL/design/design_model.tar
  config_name: train_prediction_design_al_benchmark
  design_config_name: train
  save_path: AL_hazard_center
  save_folder: AL_hazard_center

optimizer:
  lower_bound: -5.0
  upper_bound: 5.0
  optimize_mode: budget
  soft_constraint_weight: 1 
  budget_cost_normalization: true 
  budget_transition_constraint: true 

wandb:
  group: null
  project: cost-aware-AL-budget
  api_key: null  # read from the WANDB_API_KEY environment variable when set

hydra:
  run:
    dir: outputs/${now:%Y-%m-%d}/${now:%H-%M-%S}
  sweep:
    dir: outputs/multirun/${now:%Y-%m-%d}/${now:%H-%M-%S}
    subdir: ${hydra.job.num}
  job:
    chdir: false

device: "cuda"
fix_seed: true
seed: 42
time_token: false
