task:
  _target_: tasks.gaussian_process.GPTask
  name: AL_data
  dim_x: 2
  dim_y: 1
  embedding_type: data
  mask_type:
  - all
  n_selected_targets: null
  predefined_masks: null
  predefined_mask_weights: null
  mask_index: null
  attend_to: null
  n_context_init: 1
  n_query_init: 200
  n_target_data: 200
  n_target_theta: 0
  design_scale: 5
  noise_scale: 0.01
  lengthscale_lower: 0.1
  lengthscale_upper: 2.0
  min_n_context: 1
  max_n_context: 30
embedder:
  _target_: ALINE.model.embedder.Embedder
  dim_x: ${task.dim_x}
  dim_y: ${task.dim_y}
  dim_embedding: ${encoder.dim_embedding}
  dim_feedforward: ${encoder.dim_feedforward}
  n_target_theta: ${task.n_target_theta}
  embedding_type: ${task.embedding_type}
encoder:
  _target_: ALINE.model.encoder.Encoder
  dim_embedding: 32
  dim_feedforward: 128
  n_head: 4
  dropout: 0.0
  num_layers: 3
  n_target_theta: ${task.n_target_theta}
head:
  _target_: ALINE.model.head.OutputHead
  dim_x: ${task.dim_x}
  dim_y: ${task.dim_y}
  dim_embedding: ${encoder.dim_embedding}
  dim_feedforward: ${encoder.dim_feedforward}
  num_components: 10
  single_head: false
  std_min: 0.0001
  value_head: false
  time_token: ${time_token}
acquisition_function: acquisition_functions.budgeted_eig.BudgetedDataEIGAcquisition
prediction_only: true
n_step: 30
batch_size_random: 200
batch_size_design: 64
max_epoch: 100000
burning_epoch: 98000
verbose: 1
lr: 0.0001
optimizer: Adam
clip_grads: true
device: cuda
fix_seed: true
seed: 42
output_dir: ALINE/outputs/al_data/train_with_design
file_name: prediction_model.pth
checkpoint_name: ckpt.tar
wandb:
  use_wandb: true
  project: prediction_training
  run_name: al_data
  group: prediction_with_design
load_checkpoint: false
checkpoint: 1000
T: 1
T_final: 1
L: 100
M: 100
L_final: 1000
M_final: 1000
eval_batch_size: 32
eval_batch_size_final: 32
n_query_final: 100
time_token: false
alpha: 1.0
beta: 1.0
gamma: 0.9
