# Prediction-only training configuration
defaults:
  - task: ces
  - embedder: embedder
  - encoder: encoder
  - head: head
  - _self_

# Training mode settings
prediction_only: true  # Enable prediction-only mode

# Training parameters
batch_size: 200
max_epoch: 100000
verbose: 100

# Learning rate settings
lr: 1e-4
optimizer: "Adam"
clip_grads: true


# Device settings
device: "cuda"
fix_seed: true
seed: 42

# Output settings
output_dir: "./outputs/train"
file_name: "prediction_model.pth"
checkpoint_name: ckpt.tar

# Wandb settings
wandb:
  use_wandb: true 
  project: "prediction_training"
  run_name: "ces"
  group: "prediction_only"

# Checkpoint settings
load_checkpoint: false
checkpoint: 10000

# Unused but kept for compatibility
T: 1
T_final: 1
L: 100
M: 100
L_final: 1000
M_final: 1000
eval_batch_size: 32
eval_batch_size_final: 32
n_query_final: 100
time_token: false
burning_epoch: 0
alpha: 1.0
beta: 1.0
gamma: 0.9 