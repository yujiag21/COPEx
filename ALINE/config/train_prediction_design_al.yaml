# Prediction-only training configuration
defaults:
  - task: al_data #location_finding_budgeted
  - embedder: embedder
  - encoder: encoder
  - head: head
  - _self_

acquisition_function: acquisition_functions.budgeted_eig.BudgetedDataEIGAcquisition

# Training mode settings
prediction_only: true  # Enable prediction-only mode
n_step: 30

# Training parameters
batch_size_random: 200
batch_size_design: 64
max_epoch: 100000
burning_epoch: 98000
verbose: 1

# Learning rate settings
lr: 1e-4
optimizer: "Adam"
clip_grads: true

# Device settings
device: "cuda"
fix_seed: true
seed: 42

# Output settings
output_dir: "ALINE/outputs/al_data/train_with_design"
file_name: "prediction_model.pth"
checkpoint_name: ckpt.tar

# Wandb settings
wandb:
  use_wandb: true 
  project: "prediction_training"
  run_name: "al_data"
  group: "prediction_with_design"

# Checkpoint settings
load_checkpoint: false
checkpoint: 1000

# Unused but kept for compatibility
T: 1
T_final: 1
L: 100
M: 100
L_final: 1000
M_final: 1000
eval_batch_size: 32
eval_batch_size_final: 32
n_query_final: 100
time_token: false
alpha: 1.0
beta: 1.0
gamma: 0.9 